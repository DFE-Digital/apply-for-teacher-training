name: PostgreSQL - Restore

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: qa
        type: choice
        options:
          - qa
          - staging
          - sandbox
          - production

      restore-file:
        description: Backup file to restore
        required: true
        type: string

permissions:
  id-token: write

env:
  SERVICE_NAME: apply
  SERVICE_SHORT: att
  TF_VARS_PATH: terraform/aks/workspace_variables

jobs:
  restore:
    name: PostgreSQL Restore
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    env:
      DEPLOY_ENV: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: DFE-Digital/github-actions/postgres-tools@master
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          operation: restore
          service-name: ${{ env.SERVICE_NAME }}
          service-short: ${{ env.SERVICE_SHORT }}
          environment: ${{ env.DEPLOY_ENV }}
          tf-vars-path: ${{ env.TF_VARS_PATH }}
          restore-file: ${{ inputs.restore-file }}

      - name: Notify teams channel on job failure
        if: ${{ failure() }}
        uses: DFE-Digital/github-actions/send-to-teams-channel@master
        with:
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: PostgreSQL Restore
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
          message: |
            Database restore failed in ${{ env.DEPLOY_ENV }}

      - name: Notify teams channel on workflow success
        if: ${{ success() }}
        uses: DFE-Digital/github-actions/send-to-teams-channel@master
        with:
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: PostgreSQL Restore
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
          status: good
          minimal: true
          message: |
            Database restore completed successfully in ${{ env.DEPLOY_ENV }}
