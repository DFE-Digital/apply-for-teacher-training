name: PostgreSQL - Custom Restore

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - qa
          - staging
          - sandbox
          - production

      restore-file:
        description: Backup file to restore
        required: true
        type: string

      destination-server:
        description: Target PostgreSQL server
        required: true
        type: string

      destination-database:
        description: Target database
        required: true
        type: string

permissions:
  id-token: write

jobs:
  custom-restore:
    name: PostgreSQL Custom Restore
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    env:
      DEPLOY_ENV: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Derive PostgreSQL resource names
        id: derive_names
        shell: bash
        run: make postgres-tools-action-inputs CONFIG="${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"

      - uses: DFE-Digital/github-actions/postgres-tools@master
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          operation: restore-custom
          cluster-name: ${{ steps.derive_names.outputs.cluster_name }}
          cluster-rg: ${{ steps.derive_names.outputs.cluster_rg }}
          namespace: ${{ steps.derive_names.outputs.namespace }}
          storage-account-name: ${{ steps.derive_names.outputs.storage_account_name }}
          deployment-name: ${{ steps.derive_names.outputs.deployment_name }}
          db-tools-pod-name: ${{ steps.derive_names.outputs.db_tools_pod_name }}
          container-name: ${{ steps.derive_names.outputs.container_name }}
          restore-file: ${{ inputs.restore-file }}
          destination-server: ${{ inputs.destination-server }}
          destination-database: ${{ inputs.destination-database }}
