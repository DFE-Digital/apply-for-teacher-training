name: PostgreSQL - Backup

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: qa
        type: choice
        options:
          - qa
          - staging
          - sandbox
          - production

  schedule:
    - cron: "50 5 * * *" # 05:50 UTC

permissions:
  id-token: write

jobs:
  backup:
    name: PostgreSQL Backup
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment || 'production' }}

    env:
      DEPLOY_ENV: ${{ inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Derive PostgreSQL resource names
        id: derive_names
        shell: bash
        run: make postgres-tools-action-inputs CONFIG="${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"

      - uses: DFE-Digital/github-actions/postgres-tools@master
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          operation: backup
          cluster-name: ${{ steps.derive_names.outputs.cluster_name }}
          cluster-rg: ${{ steps.derive_names.outputs.cluster_rg }}
          namespace: ${{ steps.derive_names.outputs.namespace }}
          storage-account-name: ${{ steps.derive_names.outputs.storage_account_name }}
          deployment-name: ${{ steps.derive_names.outputs.deployment_name }}
          db-tools-pod-name: ${{ steps.derive_names.outputs.db_tools_pod_name }}
          container-name: ${{ steps.derive_names.outputs.container_name }}

      - name: Notify teams channel on job failure
        if: ${{ failure() }}
        uses: DFE-Digital/github-actions/send-to-teams-channel@master
        with:
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: PostgreSQL Backup
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
          message: |
            The PostgreSQL backup of ${{ env.DEPLOY_ENV }} has failed

      - name: Notify teams channel on workflow success
        if: ${{ success() }}
        uses: DFE-Digital/github-actions/send-to-teams-channel@master
        with:
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: PostgreSQL Backup
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
          status: good
          minimal: true
          message: |
            The PostgreSQL backup of ${{ env.DEPLOY_ENV }} completed successfully
