name: Test Centralised PostgreSQL List Backups

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - qa
          - staging
          - sandbox
          - production

permissions:
  id-token: write

env:
  SERVICE_NAME: apply
  SERVICE_SHORT: att
  TF_VARS_PATH: terraform/aks/workspace_variables
  RESOURCE_PREFIX: s189t01

jobs:

  list-backups:

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:

      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: DFE-Digital/github-actions/postgres-tools@master
        with:
          operation: list-backups
          service-name: ${{ env.SERVICE_NAME }}
          service-short: ${{ env.SERVICE_SHORT }}
          environment: ${{ inputs.environment }}
          tf-vars-path: ${{ env.TF_VARS_PATH }}
          resource-prefix: ${{ env.RESOURCE_PREFIX }}