# Auto-approves and merges minor/patch dependabot PRs.
# Stage 1 (pull_request): approves eligible PRs as github-actions[bot].
# Stage 2 (workflow_run): merges the PR once Build and Deploy is green.
# The merge uses AUTO_MERGE_TOKEN rather than GITHUB_TOKEN
# GITHUB_TOKEN does not start other workflows

name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

env:
  # Packages excluded from auto-merge (require manual review)
  EXCLUDED_PACKAGES: |
    govuk-components
    govuk_design_system_formbuilder
    govuk-frontend
    @ministryofjustice/frontend
    dfe-analytics
    dfe-reference-data
    view-components

jobs:
  auto-approve:
    name: Auto-approve Dependabot PRs
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Match dependency against EXCLUDED_PACKAGES list: exact name match
      - name: Check if package is excluded from auto-merge
        id: excluded
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          is_excluded=false
          while IFS= read -r EXCLUDED; do
            if [ -z "$EXCLUDED" ]; then
              continue
            fi
            if printf '%s\n' "$DEPENDENCY_NAMES" | tr ',' '\n' | grep -Fxq "$EXCLUDED"; then
              echo "Excluded package detected: $EXCLUDED"
              is_excluded=true
              break
            fi
          done <<< "$EXCLUDED_PACKAGES"

          echo "is_excluded=$is_excluded" >> "$GITHUB_OUTPUT"

      - name: Approve minor/patch updates
        if: |
          steps.excluded.outputs.is_excluded == 'false' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after Build and Deploy passes for dependabot pull_request events only
  auto-merge:
    name: Merge approved Dependabot PRs
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'

    steps:
      - name: Find and merge Dependabot PR
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $BRANCH"
            exit 0
          fi

          # Merge only the commit Build and Deploy went green for; if the head
          # has moved, the newer commit's own workflow_run will handle it.
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "PR #$PR_NUMBER head moved ($EXPECTED_SHA -> $HEAD_SHA), skipping"
            exit 0
          fi

          # reviewDecision is only populated when branch protection requires
          # approving reviews (this repo does not), so check review records.
          APPROVED=$(gh pr view "$PR_NUMBER" --json reviews --jq '[.reviews[].state] | any(. == "APPROVED")')
          if [ "$APPROVED" != "true" ]; then
            echo "PR #$PR_NUMBER is not approved, skipping"
            exit 0
          fi

          echo "Merging PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --squash
