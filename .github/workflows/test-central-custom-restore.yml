name: Test Centralised PostgreSQL Custom Restore

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - qa
          - staging
          - sandbox
          - production

      restore-file:
        description: Backup file to restore
        required: true
        type: string

      destination-server:
        description: Target PostgreSQL server
        required: true
        type: string

      destination-database:
        description: Target database
        required: true
        type: string

permissions:
  id-token: write

env:
  SERVICE_NAME: apply
  SERVICE_SHORT: att
  TF_VARS_PATH: terraform/aks/workspace_variables

jobs:
  custom-restore:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: DFE-Digital/github-actions/postgres-tools@3113-adds-new-postgres-backup
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          operation: restore-custom
          service-name: ${{ env.SERVICE_NAME }}
          service-short: ${{ env.SERVICE_SHORT }}
          environment: ${{ inputs.environment }}
          tf-vars-path: ${{ env.TF_VARS_PATH }}
          restore-file: ${{ inputs.restore-file }}
          destination-server: ${{ inputs.destination-server }}
          destination-database: ${{ inputs.destination-database }}
