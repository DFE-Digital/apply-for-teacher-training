name: List database AKS backups

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to inspect
        required: true
        default: qa
        type: choice
        options:
          - qa
          - staging
          - sandbox
          - production
  push:
    branches:
      - 3019-testing

permissions:
  id-token: write

jobs:
  list-backups:
    name: List available database backups
    runs-on: ubuntu-latest

    environment:
      name: qa

    env:
      DEPLOY_ENV: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v6

      - name: Install kubectl
        uses: DFE-Digital/github-actions/set-kubectl@master

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set kubelogin environment
        uses: DFE-Digital/github-actions/set-kubelogin-environment@master
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: Grant exec on scripts
        run: |
          chmod +x ./scripts/*.sh

      - name: List available backups
        run: |
          make ci ${{ env.DEPLOY_ENV }} aks_db_job_list_backups
