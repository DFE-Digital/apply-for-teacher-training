---
openapi: 3.0.0
info:
  version: v2.0
  title: Apply API
  contact:
    name: DfE
    email: becomingateacher@digital.education.gov.uk
  description: |
    API for DfE’s Apply for teacher training service.
    Endpoints with the `/applications` prefix are considered stable.
    Experimental endpoints prefixed with `/test-data` may change or be removed.
servers:
- description: Sandbox (test environment for vendors)
  url: https://sandbox.apply-for-teacher-training.service.gov.uk/api/v2.0
- description: Production
  url: https://www.apply-for-teacher-training.service.gov.uk/api/v2.0
paths:
  "/applications":
    get:
      tags:
      - Application management
      summary: Get many applications
      description: |
        This endpoint can be used to retrieve applications for the authenticating
        provider. Applications are returned with the most recently updated ones first.

        Use the `since` parameter to limit the number of results. This is intended
        to make it possible to check for new or updated applications regularly.

        Retrieving applications in "pages" allows you to handle large volumes of applications in smaller, manageable batches.

        Use the `page` parameter to retrieve the indicated page of results. The first call should ask for page 1.
        Use the links object in the response to navigate subsequent paginated results.

        Use the `per_page` parameter to specify how many applications to return per page. The default and maximum value is 50.

        The `page` parameter is required. The `per_page` parameter is optional and defaults to 50 if omitted.
      parameters:
      - name: since
        description: Include only applications changed or created on or since a date
          and time. Times should be in ISO 8601 format.
        in: query
        required: true
        example: '2019-12-13T12:00:00Z'
        schema:
          type: string
          format: date-time
      - name: page
        description: Page number
        in: query
        required: true
        example: 1
        schema:
          type: integer
      - name: per_page
        description: Number of records to return per page (e.g. 50)
        in: query
        required: false
        example: 50
        schema:
          type: integer
      responses:
        '200':
          description: An array of applications
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MultipleApplicationsResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/ParameterMissing"
  "/applications/{application_id}":
    get:
      tags:
      - Application management
      summary: Get a single application
      parameters:
      - "$ref": "#/components/parameters/application_id"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/offer":
    post:
      tags:
      - Application management
      summary: Make an offer
      description: |
        Make an offer to the candidate.

        This will transition the application to the [offer state](/api-docs/lifecycle#offer).

        If the application has already received an offer, POSTing a second offer will change that offer.

        The replacement offer must be for a different course to that originally offered.

        After changing an offer, the updated course details are included in the Offer object. The Application Course object will always return the original course the candidate applied to.
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        description: |
          The conditions of the offer

          Providing a request body with an array of conditions is equivalent to making a **conditional** offer.
          For an **unconditional** offer, provide an empty array.

          You can provide an optional `course` object if you wish to suggest a different course code, location, or year of entry.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  "$ref": "#/components/schemas/MakeOffer"
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/confirm-enrolment":
    post:
      tags:
      - Application management
      summary: Confirm enrolment (DEPRECATED)
      description: |
        This endpoint has been deprecated and will return the application without changing it.

        There is currently no meaning to "enrolment" in Apply for teacher training.
      parameters:
      - "$ref": "#/components/parameters/application_id"
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              required:
              - meta
              type: object
              properties:
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/confirm-conditions-met":
    post:
      tags:
      - Application management
      summary: Confirm offer conditions
      description: |
        Confirm that the candidate has met all the conditions set out in the offer

        This will transition the application to the [recruited state](/api-docs/lifecycle#recruited).
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - meta
              properties:
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/conditions-not-met":
    post:
      tags:
      - Application management
      summary: Conditions not met
      description: |
        The candidate has not met all the conditions set out in the offer.

        This will transition the application to the [conditions\_not\_met state](/api-docs/lifecycle#conditions_not_met).
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - meta
              properties:
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/reject":
    post:
      tags:
      - Application management
      summary: Reject application (DEPRECATED)
      description: 'This endpoint has been deprecated. Please use `/reject-by-codes`

        '
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        description: The reason for rejection or offer withdrawal
        content:
          application/json:
            schema:
              type: object
              required:
              - meta
              - data
              properties:
                data:
                  "$ref": "#/components/schemas/Rejection"
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/reference-data/gcse-subjects":
    get:
      tags:
      - Reference data
      responses:
        '200':
          description: An array of possible GCSE subjects. Candidates are offered
            these in an autocomplete when filling in the form, but are also able to
            provide free-text responses.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListResponse"
  "/reference-data/gcse-grades":
    get:
      tags:
      - Reference data
      responses:
        '200':
          description: An array of possible GCSE grades including double-award grades.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListResponse"
  "/reference-data/a-and-as-level-subjects":
    get:
      tags:
      - Reference data
      responses:
        '200':
          description: An array of possible A and AS level subjects. Candidates are
            offered these in an autocomplete when filling in the form, but are also
            able to provide free-text responses.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListResponse"
  "/reference-data/a-and-as-level-grades":
    get:
      tags:
      - Reference data
      responses:
        '200':
          description: An array of possible A and AS level grades.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListResponse"
  "/test-data/regenerate":
    post:
      tags:
      - Testing
      summary: Regenerate test data (DEPRECATED)
      description: 'This endpoint has been deprecated and will return an error. Please
        use `/test-data/clear` and `/test-data/generate`.

        '
      parameters:
      - name: count
        description: How many items to generate (max 100)
        in: query
        schema:
          type: integer
      deprecated: true
      responses:
        '200':
          "$ref": "#/components/responses/OK"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/test-data/generate":
    post:
      tags:
      - Testing
      summary: Generate test data
      description: 'Submits a request to generate n new applications, defaulting to
        100 applications with one course choice per application. The applications
        are generated asynchronously, and will appear once they have been generated.
        Does not change existing data. Only available on the Sandbox. EXPERIMENTAL
        — this endpoint may change or disappear.

        '
      parameters:
      - name: count
        description: How many applications to generate (max 100)
        in: query
        schema:
          type: integer
          default: 100
          maximum: 100
      - name: courses_per_application
        description: How many courses each generated application should apply to
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 3
      - name: for_training_courses
        description: Generate applications for courses your organisation runs. Please
          specify 'true', for example for_training_courses=true. Will be set to true
          if neither for_ratified_courses or for_test_provider_courses are true
        in: query
        schema:
          type: string
      - name: for_ratified_courses
        description: Generate applications for courses your organisation gives Qualified
          Teacher Status (QTS) for but does not run. For example, your organisation
          may be a Higher Education Institution ratifying School Direct courses. Please
          specify 'true', for example for_ratified_courses=true
        in: query
        schema:
          type: string
      - name: for_test_provider_courses
        description: Generate applications for courses run by a test provider, separate
          to your organisation. Please specify 'true', for example for_test_provider_courses=true
        in: query
        schema:
          type: string
      - name: previous_cycle
        description: Generate applications for courses in the previous recruitment
          cycle. Please specify 'true', for example previous_cycle=true. The application
          will have a ‘pending_conditions’ state and also ‘withdrawn’ if there is
          more than one course choice per application form.
        in: query
        schema:
          type: string
          default: false
      responses:
        '200':
          "$ref": "#/components/responses/OK"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/test-data/clear":
    post:
      tags:
      - Testing
      summary: Clear test data
      description: 'Deletes ALL application data for the current provider regardless
        of how it was created. Only available on the Sandbox. EXPERIMENTAL — this
        endpoint may change or disappear.

        '
      responses:
        '200':
          "$ref": "#/components/responses/OK"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/reference/{reference_id}/success":
    post:
      tags:
      - Testing
      summary: Simulate successful reference feedback
      description: Sets the correct status and related fields for successful reference
        feedback. Reference must exist in `feedback_requested` state. Only available
        on the Sandbox. EXPERIMENTAL — this endpoint may change or disappear.
      responses:
        '200':
          "$ref": "#/components/responses/OK"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/reference/{reference_id}/failure":
    post:
      tags:
      - Testing
      summary: Simulate failed reference feedback
      description: Sets the correct status and related fields for rejected reference
        feedback. Reference must exist in `feedback_requested` state. Only available
        on the Sandbox. EXPERIMENTAL — this endpoint may change or disappear.
      responses:
        '200':
          "$ref": "#/components/responses/OK"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/defer-offer":
    post:
      tags:
      - Application management
      summary: Defer an offer
      description: |
        Defers an offer to the next cycle.

        This will transition the application to the [offer\_deferred state](/api-docs/lifecycle#offer_deferred).
        The fields `offer_deferred_at`, `status_before_deferral` and `deferred_to_recruitment_cycle_year` will be populated.
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - meta
              properties:
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/confirm-deferred-offer":
    post:
      tags:
      - Application management
      summary: Confirm a deferred offer
      description: |
        Confirms a deferred offer from a previous cycle to the current one.

        If you provide the optional Course object, the call will succeed with updated course details.

        If you do not provide the optional Course object, the call will succeed only if the same course, location and study_mode combination is available in the current recruitment cycle. Otherwise it will return a 422.
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  "$ref": "#/components/schemas/ConfirmDeferredOffer"
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/withdraw":
    post:
      tags:
      - Application management
      summary: Withdraw an application
      description: |
        Withdraws an application or declines an offer at the candidate’s request.

        This will transition the application to the [withdrawn state](/api-docs/lifecycle#withdrawn) or the [declined state](/api-docs/lifecycle#declined).
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - meta
              properties:
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/interviews/create":
    post:
      tags:
      - Interview management
      summary: Create interview or update status to 'interviewing'
      description: 'If a request body (CreateInterview object) is provided, it creates
        an interview for this application. If no request body is provided, it updates
        the application status to ''interviewing'' without creating an interview.

        '
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        description: Interview details
        content:
          application/json:
            schema:
              type: object
              required:
              - meta
              properties:
                data:
                  "$ref": "#/components/schemas/CreateInterview"
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/interviews/{interview_id}/update":
    post:
      tags:
      - Interview management
      summary: Update interview
      description: 'Updates an existing interview for this application.

        '
      parameters:
      - "$ref": "#/components/parameters/application_id"
      - "$ref": "#/components/parameters/interview_id"
      requestBody:
        description: Interview details
        content:
          application/json:
            schema:
              type: object
              required:
              - meta
              - data
              properties:
                data:
                  "$ref": "#/components/schemas/UpdateInterview"
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/interviews/{interview_id}/cancel":
    post:
      tags:
      - Interview management
      summary: Cancel interview
      description: 'Cancels an existing interview for this application.

        '
      parameters:
      - "$ref": "#/components/parameters/application_id"
      - "$ref": "#/components/parameters/interview_id"
      requestBody:
        description: Interview details
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  "$ref": "#/components/schemas/CancelInterview"
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/notes/create":
    post:
      tags:
      - Note management
      summary: Create note
      description: |
        Creates a new note for this application.
        The `updated_at` timestamp will be set to the time of the API call.
        Its author details will be read from the attribution part of MetaData.
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        description: Note details
        content:
          application/json:
            schema:
              type: object
              required:
              - meta
              - data
              properties:
                data:
                  "$ref": "#/components/schemas/CreateNote"
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/applications/{application_id}/reject-by-codes":
    post:
      tags:
      - Application decision workflow
      summary: Reject an application with reasons codes
      description: |
        Rejects the application.
        Reasons for rejection can be stated as multiple codes with an optional description.
      parameters:
      - "$ref": "#/components/parameters/application_id"
      requestBody:
        description: Reasons for rejection
        content:
          application/json:
            schema:
              type: object
              required:
              - meta
              - data
              properties:
                data:
                  type: array
                  items:
                    "$ref": "#/components/schemas/RejectionReason"
                meta:
                  "$ref": "#/components/schemas/MetaData"
      responses:
        '200':
          description: An application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleApplicationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/reference-data/rejection-reason-codes":
    get:
      tags:
      - Reference data
      responses:
        '200':
          description: An array of possible rejection reason codes and rejection reason
            descriptions.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ObjectListResponse"
components:
  responses:
    OK:
      description: Successful response
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/OkResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/NotFoundResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UnauthorizedResponse"
    ParameterMissing:
      description: A required URL parameter was empty or missing
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ParameterMissingResponse"
    UnprocessableEntity:
      description: Returned when the request body was missing data or contained invalid
        data
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UnprocessableEntityResponse"
    PageParameterInvalidResponse:
      description: Returned when the parameter was invalid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PageParameterInvalidResponse"
    PerPageParameterInvalidResponse:
      description: Returned when the parameter was invalid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PerPageParameterInvalidResponse"
  schemas:
    MultipleApplicationsResponse:
      type: object
      required:
      - data
      - links
      - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Application"
        links:
          "$ref": "#/components/schemas/Links"
        meta:
          "$ref": "#/components/schemas/ResponseMetaMultiple"
    SingleApplicationResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          "$ref": "#/components/schemas/Application"
        meta:
          "$ref": "#/components/schemas/ResponseMetaSingle"
    Application:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - attributes
      properties:
        id:
          type: string
          description: The unique ID of this application. This identifies an application
            to a single course, also known as an application choice. Candidates can
            submit up to three application choices at a time.
          maxLength: 10
          example: 11fc0d3b2f
        type:
          type: string
          description: Type of the object, always "application"
          enum:
          - application
          example: application
        attributes:
          "$ref": "#/components/schemas/ApplicationAttributes"
    ApplicationAttributes:
      type: object
      additionalProperties: false
      required:
      - possible_undeclared_previous_teacher_training_url
      properties:
        application_url:
          type: string
          description: The URL of this application as seen in the Manage teacher training
            applications web interface.
          example: https://www.apply-for-teacher-training.service.gov.uk/provider/applications/1234
        support_reference:
          type: string
          deprecated: true
          description: 'The candidate’s reference number for their application form
            carrying this application choice in the Apply system. Candidates can have
            multiple application forms. For instance, when a candidate moves from
            Apply 1 to Apply again their candidate ID will stay the same, but that’s
            a new application form so the `support_reference` will be different.  DEPRECATED:
            this field is being deprecated as applications should be identified using
            the application id.'
          maxLength: 10
          example: AB1234
        status:
          type: string
          description: |
            The status of this application. Refer to the [application
            lifecycle diagram](/api-docs/lifecycle) for states and transitions.
          enum:
          - awaiting_provider_decision
          - interviewing
          - conditions_not_met
          - declined
          - offer
          - offer_deferred
          - pending_conditions
          - recruited
          - rejected
          - withdrawn
          example: awaiting_provider_decision
          maxLength: 256
        phase:
          type: string
          description: |
            The phase of this application. In the first phase, "Apply 1", the
            candidate can choose up to 4 courses. If all of those choices are rejected,
            declined, or withdrawn, the user can go into "Apply 2".
            In "Apply 2", a user can also choose up to 4 courses.
          enum:
          - apply_1
          - apply_2
          example: apply_1
          deprecated: true
        submitted_at:
          type: string
          format: date-time
          description: The date and time the Candidate first submitted in this cycle.
            See `sent_to_provider_at` for the date and time this specific Application
            was submitted.
          example: '2019-06-13T10:44:31Z'
          deprecated: true
        updated_at:
          type: string
          format: date-time
          description: Time of last change
          example: '2019-06-13T10:44:31Z'
        reject_by_default_at:
          type: string
          format: date-time
          nullable: true
          description: Time when the application is due to be rejected by default
          example: '2019-06-13T23:59:59Z'
        recruited_at:
          type: string
          format: date-time
          nullable: true
          description: When the candidate met their conditions, receiving a firm place
            on the course
          example: '2019-06-13T23:59:59Z'
        personal_statement:
          type: string
          maxLength: 10240
          description: The candidate’s personal statement, combined from the "Becoming
            a Teacher" and "Subject Knowledge" fields in the application form
          example: Since retiring from the Police Service in 2007...
        interview_preferences:
          type: string
          maxLength: 10240
          description: The candidate’s interview availability
          example: I cannot come to interview on Thursdays
        candidate:
          "$ref": "#/components/schemas/Candidate"
        contact_details:
          "$ref": "#/components/schemas/ContactDetails"
        course:
          "$ref": "#/components/schemas/Course"
        qualifications:
          "$ref": "#/components/schemas/Qualifications"
        work_experience:
          "$ref": "#/components/schemas/WorkExperiences"
        references:
          type: array
          items:
            "$ref": "#/components/schemas/Reference"
          description: |
            Referee details will appear as soon as a reference is added by the candidate.
            Reference feedback will only be included once a candidate has accepted an offer and has received a reference.
            References will not appear if their application is unsuccessful (e.g. offer declined, application rejected).
            There is no limit to the number of references.
        offer:
          anyOf:
          - type:
          - "$ref": "#/components/schemas/Offer"
        withdrawal:
          anyOf:
          - type:
          - "$ref": "#/components/schemas/Withdrawal"
        rejection:
          anyOf:
          - type:
          - "$ref": "#/components/schemas/Rejection"
        hesa_itt_data:
          anyOf:
          - type:
          - "$ref": "#/components/schemas/HESAITTData"
          deprecated: true
          description: |
            Values to populate this candidate’s HESA Initial Teacher
            Training data return.  Available once an offer has been accepted.

            Deprecation warning: HESA code fields (sex/disability/ethnicity) within this object will contain `nil` or an empty array
            for applications in the 2023 recruitment cycle.
        further_information:
          type: string
          maxLength: 10240
          nullable: true
          description: Other personal or professional issues relevant to the application
            which are not covered in the form
          example: I am expecting to be called for jury service in the next 12 months
        safeguarding_issues_status:
          type: string
          description: Status of candidate’s response to the safeguarding issues declaration
          enum:
          - no_safeguarding_issues_to_declare
          - has_safeguarding_issues_to_declare
          - never_asked
          example: has_safeguarding_issues_to_declare
        safeguarding_issues_details_url:
          type: string
          description: URL to Apply system where safeguarding issues disclosed by
            the candidate can be access by users with permissions to view safeguarding
            information.
          example: https://apply-for-teacher-training.service.gov.uk/provider/applications/1#criminal-convictions-and-professional-misconduct
          nullable: true
        previous_teacher_training:
          type: array
          items:
            "$ref": "#/components/schemas/PreviousTeacherTraining"
          description: The previous teacher training declaration of the candidate,
            including details if the candidate has previous started training.
        anonymised:
          type: boolean
          description: Indicates if a candidate has been removed from the Apply service
          example: true
        interviews:
          type: array
          items:
            "$ref": "#/components/schemas/Interview"
        notes:
          type: array
          items:
            "$ref": "#/components/schemas/Note"
        withdrawn_or_declined_for_candidate:
          type: boolean
          nullable: true
          description: Was application withdrawn or offer declined at candidate’s
            request
          example: true
        equality_and_diversity:
          anyOf:
          - "$ref": "#/components/schemas/EqualityAndDiversity"
          nullable: true
        sent_to_provider_at:
          type: string
          format: date-time
          description: The date and time the application was sent to the provider
          example: '2024-07-10T13:00:00+01:00'
        inactive:
          type: boolean
          description: Indicates whether the application is inactive, based on time-sensitive
            criteria. If true, the application is considered inactive; otherwise,
            it remains active.
          example: true
          enum:
          - true
          - false
        possible_undeclared_previous_teacher_training_url:
          type: string
          description: A URL to view data concerning possible undeclared previous
            teacher training details associated with an application. The value is
            `null` if no possible undeclared training has been identified.
          example: https://www.apply-for-teacher-training.service.gov.uk/provider/applications/1234567#previous_teacher_trainings
    Candidate:
      type: object
      additionalProperties: false
      required:
      - obtaining_english_language_qualification_details
      properties:
        id:
          type: string
          description: The candidate’s unique ID in the Apply system.
          maxLength: 10
          example: C5432
        first_name:
          type: string
          description: The candidate’s first name
          maxLength: 60
          example: Boris
        last_name:
          type: string
          description: The candidate’s last name
          example: Brown
          maxLength: 60
        date_of_birth:
          type: string
          format: date
          description: The candidate’s date of birth
          example: '1985-02-13'
        nationality:
          type: array
          items:
            type: string
            pattern: "^[A-Z]{2}$"
            example: NL
          maxItems: 5
          description: One or more ISO 3166-2 country codes
        domicile:
          type: string
          maxLength: 2
          description: The candidate’s domicile, extracted from their address. Coded
            according to [the HESA DOMICILE field](https://www.hesa.ac.uk/collection/c20051/a/domicile).
          example: XF
        uk_residency_status:
          type: string
          maxLength: 256
          description: The candidate’s UK residency status indicating their right
            to work and study in the UK. Possible values include "UK Citizen", "Irish
            Citizen", "Candidate needs to apply for permission to work and study in
            the UK", "EU settled status" and "EU pre-settled status". The candidate
            can also provide details as free text for example "Settled status".
          example: UK Citizen
        uk_residency_status_code:
          type: string
          maxLength: 1
          description: |
            Single alphabetical character code for the candidate’s UK residency status indicating their right to work and study in the UK:

            - A - UK Citizen
            - B - Irish Citizen
            - C - Candidate needs to apply for permission to work and study in the UK
            - D - Candidate's free text response

            These values do not correspond to the UCAS residency statuses.
          example: B
          enum:
          - A
          - B
          - C
          - D
        fee_payer:
          type: string
          maxLength: 2
          description: Provisional fee payer status based on a candidate's nationality,
            residency status and domicile.
          example: '02'
          enum:
          - '02'
          - '99'
        english_main_language:
          type: boolean
          description: Does this candidate have English as a main language?
          example: true
        english_language_qualifications:
          type: string
          maxLength: 10240
          nullable: true
          description: Details of this candidate's English language qualification,
            if English is not their main language
          example: 'Name: TOEFL, Grade: 20, Awarded: 1999, Reference: 123456'
        other_languages:
          type: string
          maxLength: 10240
          nullable: true
          description: Details of the candidate’s fluency in other languages
          example: I am bilingual in Finnish and English
        disability_disclosure:
          type: string
          maxLength: 10240
          nullable: true
          description: Voluntary disclosure of disabliity or SEN so providers can
            provide appropriate support
          example: I am dyslexic
        obtaining_english_language_qualification_details:
          type: string
          maxLength: 256
          description: If the candidate intends to gain this qualification they can
            explain their intention
          example: I will gain it next year
        visa_expired_at:
          type: date-time
          description: The date when the candidate’s visa will expire
          example: '2019-06-13T10:44:31Z'
        visa_explanation:
          type: string
          maxLength: 256
          description: The candidate’s intention to resolve any issues with their
            visa expiring
          enum:
          - expires_after_course
          - renew
          - leads_to_permanent_visa
          - switch_to_different_visa
          - not_sure
          - other
          example: expires_after_course
        visa_explanation_details:
          type: string
          maxLength: 256
          description: Additional details regarding the candidate’s visa explanation,
            if the visa explanation is "other"
          example: Details of renewing my visa
        country_residency_date_from:
          type: date-time
          description: The date when the candidate moved to their current country
            of residence
          example: '2019-06-13T10:44:31Z'
        country_residency_since_birth:
          type: boolean
          description: Whether or not the candidate has been a resident of their current
            country of residence since birth
          example: true
    ContactDetails:
      type: object
      additionalProperties: false
      required:
      - address_line1
      - country
      - email
      - phone_number
      properties:
        address_line1:
          type: string
          description: The candidate’s address line 1
          maxLength: 50
          example: 45 Dialstone Lane
        address_line2:
          type: string
          description: The candidate’s address line 2
          maxLength: 50
          example: Stockport
          nullable: true
        address_line3:
          type: string
          description: The candidate’s address line 3
          maxLength: 50
          example: Greater Manchester
          nullable: true
        address_line4:
          type: string
          description: The candidate’s address line 4
          maxLength: 50
          example: England
          nullable: true
        postcode:
          type: string
          description: The candidate’s postcode
          maxLength: 25
          example: SK2 6AA
          nullable: true
        country:
          type: string
          maxLength: 2
          description: The candidate’s country - ISO 3166-2 country code
          pattern: "^[A-Z]{2}$"
          example: GB
        email:
          type: string
          description: The candidate’s email address
          maxLength: 100
          example: boris.brown@example.com
        phone_number:
          type: string
          description: The candidate’s phone number
          maxLength: 50
          example: 07700 900000
    Course:
      type: object
      additionalProperties: false
      required:
      - recruitment_cycle_year
      - provider_code
      - course_code
      - study_mode
      properties:
        recruitment_cycle_year:
          type: integer
          description: The course’s recruitment cycle year
          example: 2020
        provider_code:
          type: string
          description: The provider’s code
          example: 2FR
          maxLength: 3
        course_code:
          type: string
          description: The course’s code
          example: 3CVK
          maxLength: 4
        site_code:
          type: string
          description: The site’s code. If left blank, then a course and site must
            be uniquely determined by the other attributes.
          example: K
          maxLength: 5
          nullable: true
        study_mode:
          type: string
          description: Can be `full_time` or `part_time`
          example: full_time
          enum:
          - full_time
          - part_time
        start_date:
          type: string
          description: 'ISO8601 month and year indicating when this course starts.
            Including this field in a POST has no effect because courses are unambiguously
            identified by the rest of the properties in this object.

            '
          example: 2021-01
    Offer:
      type: object
      additionalProperties: false
      required:
      - conditions
      - course
      - status_before_deferral
      - offer_made_at
      - offer_accepted_at
      - offer_declined_at
      - offer_deferred_at
      properties:
        conditions:
          type: array
          items:
            type: string
            maxLength: 256
          description: The conditions of the offer
          maxItems: 20
          example:
          - Completion of subject knowledge enhancement
          - Completion of professional skills test
        course:
          "$ref": "#/components/schemas/Course"
        offer_made_at:
          type: string
          format: date-time
          description: Date and time the offer was made
          example: '2019-09-18T15:33:49.216Z'
        offer_accepted_at:
          type: string
          format: date-time
          description: Date and time the offer was accepted
          example: '2019-09-18T15:33:49.216Z'
          nullable: true
        offer_declined_at:
          type: string
          format: date-time
          description: Date and time the offer was declined
          example: '2019-09-18T15:33:49.216Z'
          nullable: true
        status_before_deferral:
          type: string
          nullable: true
          description: Application status before the deferral (pending_conditions
            or recruited)
          enum:
          - pending_conditions
          - recruited
          maxLength: 30
          example: pending_conditions
        deferred_to_recruitment_cycle_year:
          type: integer
          nullable: true
          description: The recruitment cycle year a deferred application can be confirmed
          example: 2020
        offer_deferred_at:
          type: string
          format: date-time
          nullable: true
          description: When this application was deferred
          example: '2019-06-10T23:59:59Z'
    MakeOffer:
      type: object
      additionalProperties: false
      required:
      - conditions
      properties:
        conditions:
          type: array
          items:
            type: string
            maxLength: 256
          description: The conditions of the offer
          maxItems: 20
          example:
          - Completion of subject knowledge enhancement
          - Completion of professional skills test
        course:
          description: An optional `course` that you wish to suggest to the candidate.
          oneOf:
          - "$ref": "#/components/schemas/Course"
    Qualification:
      type: object
      additionalProperties: false
      required:
      - id
      - qualification_type
      - non_uk_qualification_type
      - subject
      - subject_code
      - grade
      - start_year
      - award_year
      - institution_details
      - equivalency_details
      - awarding_body
      - hesa_degtype
      - hesa_degsbj
      - hesa_degclss
      - hesa_degest
      - hesa_degctry
      - hesa_degstdt
      - hesa_degenddt
      properties:
        id:
          type: integer
          description: The unique qualification ID in the Apply system
          example: 123
        qualification_type:
          type: string
          maxLength: 256
          description: The qualification awarded
          example: BA
        non_uk_qualification_type:
          nullable: true
          type: string
          maxLength: 256
          description: For a qualification of type non_uk, this field will contain
            a free-text description of the qualification type
          example: High School Diploma
        subject:
          type: string
          description: The subject studied
          maxLength: 256
          example: History and Politics
        subject_code:
          type: string
          description: The HECoS code for the subject studied, if available
          example: 100403
          nullable: true
        grade:
          type: string
          maxLength: 256
          description: The grade awarded. e.g. "2:1" for university degrees, "A" for
            GCSE, "BA*" for double-award science, or "ABC" for triple-award science.
            For triple-award science, which is the only possible value with three
            grades, the grades are in the order Biology, Physics, Chemistry.
          example: AA*B
        start_year:
          type: string
          nullable: true
          maxLength: 4
          description: The year the candidate started qualification
          example: '1989'
        award_year:
          type: string
          nullable: true
          maxLength: 4
          description: The year the award was made
          example: '1992'
        institution_details:
          type: string
          description: Details about the institution and awarding body
          maxLength: 256
          example: University of Huddersfield
          nullable: true
        equivalency_details:
          type: string
          description: Details of equivalency, if this qualification was awarded overseas
          example: 'Enic: 4000123456 - Between GCSE and GCSE AS Level - Equivalent
            to GCSE C'
          maxLength: 256
          nullable: true
        awarding_body:
          type: string
          description: 'Details about the qualification awarding body. DEPRECATED:
            this field will always be null as Apply does not collect this information.'
          deprecated: true
          maxLength: 256
          nullable: true
        hesa_degtype:
          type: string
          description: HESA code for degree type
          example: '001'
          maxLength: 20
          nullable: true
        hesa_degsbj:
          type: string
          description: HESA code for degree subject
          example: '100048'
          maxLength: 20
          nullable: true
        hesa_degclss:
          type: string
          description: HESA code for degree class
          example: '01'
          maxLength: 20
          nullable: true
        hesa_degest:
          type: string
          description: HESA code for degree establishment
          example: '0002'
          maxLength: 20
          nullable: true
        hesa_degctry:
          type: string
          description: HESA code for degree country
          example: XF
          maxLength: 2
          nullable: true
        hesa_degstdt:
          type: string
          description: Degree start date in ISO8601 format
          format: date
          example: '2019-09-18'
          maxLength: 10
          nullable: true
        hesa_degenddt:
          type: string
          description: Degree end date in ISO8601 format
          format: date
          example: '2019-09-18'
          maxLength: 10
          nullable: true
        currently_completing_qualification:
          type: boolean
          description: The response to the “Are you currently studying to retake your
            GCSE?” question.
          example: true
          nullable: true
        missing_explanation:
          type: string (limited to 50 words)
          description: The explanation if "currently_completing_qualification" is
            false
          example: I have an equivalent qualification.
          nullable: true
        other_uk_qualification_type:
          type: string (limited to 100 characters )
          description: The response to "Another UK qualification" - "Qualification
            name"
          example: Foundational Diploma
          nullable: true
    PreviousTeacherTraining:
