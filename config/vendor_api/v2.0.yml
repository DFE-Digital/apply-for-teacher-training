---
info:
  version: v2.0
servers:
- description: Sandbox (test environment for vendors)
  url: https://sandbox.apply-for-teacher-training.service.gov.uk/api/v2.0
- description: Production
  url: https://www.apply-for-teacher-training.service.gov.uk/api/v2.0
paths:
  "/applications":
    get:
      description: |
        This endpoint can be used to retrieve applications for the authenticating
        provider. Applications are returned with the most recently updated ones first.

        Use the `since` parameter to limit the number of results. This is intended
        to make it possible to check for new or updated applications regularly.

        Retrieving applications in "pages" allows you to handle large volumes of applications in smaller, manageable batches.

        Use the `page` parameter to retrieve the indicated page of results. The first call should ask for page 1.
        Use the links object in the response to navigate subsequent paginated results.

        Use the `per_page` parameter to specify how many applications to return per page. The default and maximum value is 50.

        The `page` parameter is required. The `per_page` parameter is optional and defaults to 50 if omitted.
      parameters:
      - name: since
        description: Include only applications changed or created on or since a date
          and time. Times should be in ISO 8601 format.
        in: query
        required: true
        example: '2019-12-13T12:00:00Z'
        schema:
          type: string
          format: date-time
      - name: page
        description: Page number
        in: query
        required: true
        example: 1
        schema:
          type: integer
      - name: per_page
        description: Number of records to return per page, default to 50
        in: query
        required: false
        example: 50
        schema:
          type: integer
components:
  responses:
    VersionInvalid:
      description: Returned when the API version in the URL is not available in this
        environment
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/VersionInvalidResponse"
  schemas:
    Links:
      properties:
        first:
          example: https://www.apply-for-teacher-training.service.gov.uk/api/v2.0/applications?since=2021-10-20T12:00:00Z&page=1
        last:
          example: https://www.apply-for-teacher-training.service.gov.uk/api/v2.0/applications?since=2021-10-20T12:00:00Z&page=20
        prev:
          example: https://www.apply-for-teacher-training.service.gov.uk/api/v2.0/applications?since=2021-10-20T12:00:00Z&page=1
        self:
          example: https://www.apply-for-teacher-training.service.gov.uk/api/v2.0/applications?since=2021-10-20T12:00:00Z&page=2
        next:
          example: https://www.apply-for-teacher-training.service.gov.uk/api/v2.0/applications?since=2021-10-20T12:00:00Z&page=3
    ResponseMetaMultiple:
      properties:
        api_version:
          example: v2.0
    ResponseMetaSingle:
      properties:
        api_version:
          example: v2.0
    VersionInvalidResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          minItems: 1
          description: Error objects describing the problem
          items:
            "$ref": "#/components/schemas/Error"
          example:
          - error: VersionInvalid
            message: API version is not supported
