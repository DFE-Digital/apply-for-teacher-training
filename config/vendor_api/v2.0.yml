        provider_code:
          type: string
          description: The provider’s code. This must correspond to either the training
            or the ratifying provider for the application and the course applied to.
          example: 2FR
          maxLength: 3
        date_and_time:
          type: string
          format: date-time
          description: Date and time of the interview
          example: '2019-09-18T15:33:49.216Z'
        location:
          type: string
          description: 'An optional string describing where or how the interview will
