          example: true
        commitment:
          nullable: true
          description: Whether the work was full time or part time
          type: string
          example: full_time
          enum:
          - full_time
          - part_time
        start_month:
          description: The month the position began
          oneOf:
          - "$ref": "#/components/schemas/Month"
        end_month:
          description: The month the position ended
          anyOf:
          - type:
          - "$ref": "#/components/schemas/Month"
        skills_relevant_to_teaching:
          type: boolean
          nullable: true
          description: Did the candidate use skills relevant to teaching?
          example: true
    HESAITTData:
      type: object
