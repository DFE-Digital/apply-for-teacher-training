          example: '1'
          enum:
          - '1'
          - '2'
          - '3'
        disability:
          nullable: true
          type: array
          items:
            type: string
          description: The candidate’s disabilities as an array of [2-digit HESA codes
            for Disability](https://www.hesa.ac.uk/collection/c24053/e/disable)
          example:
          - '00'
          - '51'
          enum:
          - '00'
          - '08'
          - '51'
          - '53'
          - '54'
          - '55'
          - '56'
          - '57'
          - '58'
          - '96'
        ethnicity:
          type: string
          nullable: true
          description: The candidate’s ethnicity as [a 2-digit HESA code for Ethnicity](https://www.hesa.ac.uk/collection/c24053/e/ETHNIC)
          example: '10'
          enum:
          - '10'
          - '15'
          - '21'
          - '22'
          - '29'
          - '31'
          - '32'
          - '33'
          - '34'
          - '39'
          - '41'
          - '42'
          - '43'
          - '49'
          - '50'
          - '80'
          - '90'
          - '98'
        other_disability_details:
          type: string
          nullable: true
          description: The candidate’s description of their disability, if they selected
            “Other” and entered a value. This corresponds to HESA disability code
            `96`.
          maxLength: 10240
          example: My disability is...
        other_ethnicity_details:
          type: string
          nullable: true
          description: The candidate’s description of their ethnicity, if they selected
            “Other” and entered a value.
          maxLength: 10240
          example: My ethnicity is...
    Attribution:
      type: object
      description: Attribution data is only for auditing purposes and will never be
        shared with candidates
      additionalProperties: false
      required:
      - full_name
      - email
      - user_id
      properties:
        full_name:
          type: string
          description: The full name of the user who made this update
          maxLength: 120
          example: Jane Smith
        email:
          type: string
          description: The email address of the user who made this update. This email
            can be an institution wide email
          maxLength: 100
          example: jane.smith@example.com
        user_id:
          type: string
          description: The ID of the user in the Student Record System, used for disambiguation
          maxLength: 100
          example: '12345'
    MetaData:
      type: object
      description: Required under a ‘meta’ key in the body of every POST or PUT request
      additionalProperties: false
      required:
      - attribution
      - timestamp
      properties:
        attribution:
          "$ref": "#/components/schemas/Attribution"
