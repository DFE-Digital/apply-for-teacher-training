en:
  candidate_interface:
    previous_teacher_trainings:
      start:
        new:
          title: Have you started an initial teacher training (ITT) course in England that you did not finish or pass?
        edit:
          title: Have you started an initial teacher training (ITT) course in England that you did not finish or pass?
        form:
          body: Training providers need this information for safeguarding reasons.
          you_must_add_all:
            You must tell us about every ITT course in England that you started but did not successfully finish or pass.
          if_your_entry_does_not_match:
            What you tell us must match the trainee teacher records held by the Department for Education. If it does not match, we will tell the training provider you are applying to.
          hint_summary_text:
            If you’ve already completed teacher training in England or elsewhere
          hint_html:
            Add any teaching qualifications you already have to the %{link} section.<br><br>
            If you’re eligible for or already hold QTS, you may not be able to get student finance funding for this course.<br><br>
            Training providers may suggest alternative routes into teaching in England. Find out more about %{return_to_teaching_link}
            or routes to QTS if you have %{outside_uk_experience_link}.
          link_text: other qualifications
          return_to_teaching: returning to teaching
          outside_uk_experience: teaching experience outside the UK
      names:
        new:
          title: Enter the name of the training provider
          body_html:
            "<p>For example, University of East Anglia or Teach First.</p><p> You can add another course later if you need to.</p>"
      dates:
        new:
          title: Enter the course dates
          start_date: Start date
          end_date: End date
          end_date_hint: Enter the date you left or finished the course
      details:
        new:
          title: Give details about this initial teacher training (ITT) course
          hint_html: |
            You should include:
              <ul>
              <li>the name of the course</li>
              <li>why you left or did not complete the course</li>
              </ul>
              Training providers may discuss this information with you. They may also ask you for a reference from the training provider.
      review:
        index:
          title: Check your previous teacher training
          qts_guidance_html:
            If you’re eligible for or already hold qualified teacher status (QTS) or qualified teacher learning and skills (QTLS),
            there are other routes into teaching in England.<br><br>
            Find out more about %{return_to_teaching_link} or routes to QTS if you have %{outside_uk_experience_link}.
          started_teacher_training: Have you started an initial teacher training (ITT) course in England before???
          change_started_teacher_training: whether you started a teacher training course before
          add_another_course: Add another course
          return_to_teaching: returning to teaching
          outside_uk_experience: teaching experience outside the UK
        remove:
          title: Are you sure you want to delete this previous teacher training?
          confirm: Yes, delete previous teacher training
          provider_name: Name of the training provider
          training_dates: Training dates
          details: Details
          caption: Previous teacher training
          cancel: Cancel
  activemodel:
    errors:
      models:
        candidate_interface/previous_teacher_trainings/start_form:
          attributes:
            started:
              blank: Select whether you have started a teacher training course before
        candidate_interface/previous_teacher_trainings/names_form:
          attributes:
            provider_name:
              blank: Enter the name of the training provider
              too_long: Enter a training provider name that is fewer than 100 characters
        candidate_interface/previous_teacher_trainings/dates_form:
          attributes:
            started_at:
              blank_date: Enter the date that you started the training course
              blank_date_fields: Enter the %{fields} that you started the training course
              before: Enter a course start date that is before the date you have left the course
              past: Date that you started the training course must be in the past
              invalid_date_month_and_year: Enter a real course start date, for example 5 2019
            ended_at:
              blank_date: Enter the date that you left the training course
              blank_date_fields: Enter the %{fields} that you left the training course
              invalid_date_month_and_year: Enter a real course leave date, for example 5 2019
              past: Date that you left the training course must be in the past
        candidate_interface/previous_teacher_trainings/details_form:
          attributes:
            details:
              blank: Enter details about your previous teacher training courses
              too_many_words: Your answer must be %{maximum} words or less. You have %{count} words too many.
        candidate_interface/previous_teacher_trainings/review_form:
          attributes:
            completed:
              blank: Select whether you have completed this section
