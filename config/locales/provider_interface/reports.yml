          info: 'The data will include all candidates who have accepted an offer since %{date}.'
        previous_cycle:
          info: 'The data will include all candidates who have accepted an offer from %{start_date} to %{end_date}.'
      withdrawal_reports:
        index:
          description_html:
            <p class="govuk-body">This report shows the reasons for withdrawal selected by candidates from a set list.  The question is mandatory and candidates can select more than one reason.</p>
          withdrawal_reasons_report: 'Withdrawal reasons'
